packages:
  - "apps/*"

# pnpm 10 blocks the build scripts of the dependencies by default;
# Prisma and esbuild need theirs.
onlyBuiltDependencies:
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - sharp

# Supply-chain cooldown: refuse any package version published less than
# 24 hours ago (value in minutes). It applies to sub-dependencies too.
minimumReleaseAge: 1440
