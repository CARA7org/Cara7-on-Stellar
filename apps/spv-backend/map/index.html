  footer { color: #6b7280; font-size: 12px; padding: 8px 24px 12px;

  const linkData = JSON.parse(document.getElementById('map-links').textContent);
  let mode = localStorage.getItem('map-link-mode') || 'github';
  let schemaXml = null;
  // Absolute path of the checkout, served by the backend: the browser cannot
  // know it, and local mode needs it to build the vscode:// links.
  let localRoot = '';

  async function loadLocalRoot() {
    if (localRoot) return;
    try {
      const response = await fetch('map/local-root');
      if (response.ok) localRoot = (await response.json()).root;
    } catch {
      localRoot = '';
    }
  }

  function linkFor(path) {
    return mode === 'local' && localRoot
      ? `vscode://file${localRoot}/${path}`
      : `${linkData.repo}/${path}`;
  }

  // Inject one clickable link per implemented cell: draw.io's own link
  // mechanism (UserObject wrapper), so the viewer renders and handles them.
  function xmlWithLinks() {
    const doc = new DOMParser().parseFromString(schemaXml, 'text/xml');
    for (const [id, path] of Object.entries(linkData.links)) {
      const cell = doc.querySelector(`mxCell[id="${id}"]`);
      if (!cell) continue;
      const wrapper = doc.createElement('UserObject');
      wrapper.setAttribute('label', cell.getAttribute('value') ?? '');
      wrapper.setAttribute('link', linkFor(path));
      wrapper.setAttribute('id', id);
      cell.removeAttribute('value');
      cell.removeAttribute('id');
      cell.parentNode.insertBefore(wrapper, cell);
      wrapper.appendChild(cell);
    }
    return new XMLSerializer().serializeToString(doc);
  }

  // Schema extent in draw.io coordinates (x -241..2964 plus margins).
  const CANVAS_WIDTH = 3300;

  function render() {
    const container = document.getElementById('diagram');
    container.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'mxgraph';
    // The viewer sizes its element to graph-size x zoom: pick the zoom that
    // makes the schema exactly fill the container width (vertical scroll).
    const zoom = Math.max(0.2, Math.min(1, container.clientWidth / CANVAS_WIDTH));
    el.dataset.mxgraph = JSON.stringify({
      xml: xmlWithLinks(),
      nav: true,
      resize: false,
      zoom,
      toolbar: 'zoom',
      'toolbar-position': 'top',
      'toolbar-nohide': true,
      'allow-zoom-out': true,
      'allow-zoom-in': true,
      target: 'blank',
    });
    container.appendChild(el);
    if (window.GraphViewer) {
      window.GraphViewer.createViewerForElement(el, (viewer) => flow.attach(viewer));
    }
  }

  async function setMode(next) {
    mode = next;
    localStorage.setItem('map-link-mode', mode);
    document.getElementById('mode-github').classList.toggle('on', mode === 'github');
    document.getElementById('mode-local').classList.toggle('on', mode === 'local');
    if (mode === 'local') await loadLocalRoot();
    if (schemaXml) render();
  }
  document.getElementById('mode-github').onclick = () => setMode('github');
  document.getElementById('mode-local').onclick = () => setMode('local');

      pot: '14,850 → 14,815.13 EURC',
      amount: '23.41 + 5.83 + 5.62 EURC',
      text: 'Interest accrues on each class’s OUTSTANDING nominal, actual/360: Class A 23.41, Class B 5.83, Class C 5.62 EURC in period 1. Computed PER NOTE and rounded down - the remainder joins the carry. Unpaid interest defers as a shortfall (no interest on shortfalls).',
      edges: ['Pk5OfUOHv3_TRxhxDVZG-84', 'Pk5OfUOHv3_TRxhxDVZG-85', 'Pk5OfUOHv3_TRxhxDVZG-86'],
    },
    {

      cells: ['Pk5OfUOHv3_TRxhxDVZG-77'],
    },
    {

      amount: '- 9,815.13 EURC (Class A)',
      text: 'Everything left amortizes Class A first: 9,815.13 EURC of principal in period 1. The per-note outstanding drops and the NOTE FACTOR declines - 100% → 90.18% → 80.37% → 70.55% over the three periods run so far. B and C amortize only after A is repaid in full.',
      edges: ['Pk5OfUOHv3_TRxhxDVZG-84'],
    },
    {
      kind: 'money',
      title: 'Interest AND principal go to the paying agent',
      amount: '9,838.54 EURC',
      text: 'The waterfall hands every class’s aggregate - coupon and principal together, 9,838.54 EURC for Class A - to the PAYING AGENT CONTRACT. Nothing is ever paid into the note tokens: a note has no NAV.',
      cells: ['ZIKSrII0FIwoN5GAtqwQ-21'],
      edges: ['ZIKSrII0FIwoN5GAtqwQ-26'],
    },
    {
      kind: 'money',
      title: 'The paying agent pays every noteholder',
      amount: '+ 1,963.99 EURC',
      text: 'Paying agent push_batch walks the holder registry (10 transfers per transaction): MERKL computes interest splits pro rata temporis between mid-period seller and buyer, principal follows the holder of record. Live demo: 1,963.99 EURC arrived in a Freighter wallet with no claim and no withdrawal.',
      edges: ['Pk5OfUOHv3_TRxhxDVZG-97', 'Pk5OfUOHv3_TRxhxDVZG-101', 'Pk5OfUOHv3_TRxhxDVZG-102', 'Pk5OfUOHv3_TRxhxDVZG-103', 'cTcXm5-mWiktb2D24p8G-11'],
    },
    {
      kind: 'money',
      title: 'Off-ramp: EURC back to EUR',
      amount: 'EURC → EUR',
      text: 'A noteholder who wants fiat off-ramps to their IBAN. The investor’s only exits are these repayments and selling the notes - there is no withdraw function anywhere in the chain.',
      edges: ['uk0NRVN-ux7Ab5T_4S_U-8', 'uk0NRVN-ux7Ab5T_4S_U-10', 'uk0NRVN-ux7Ab5T_4S_U-12'],
    },
    {
      kind: 'data',
      title: 'The AI agents verify everything',
      amount: 'reconciled to the stroop',
      text: 'Through the MCP data room the calculation agent recomputes the whole cascade (including the dust carry), the paying agent reconciles both legs (waterfall → agent → holders), and the audit agent ties every figure back to the chain. Their reports feed the investor dashboard.',
      cells: ['Pk5OfUOHv3_TRxhxDVZG-67', 'Pk5OfUOHv3_TRxhxDVZG-107', 'Pk5OfUOHv3_TRxhxDVZG-104', 'uk0NRVN-ux7Ab5T_4S_U-17', 'cTcXm5-mWiktb2D24p8G-12'],
    },
  ];

  const flow = {
    viewer: null, active: false, index: 0,
    highlights: [], dots: [], raf: null,

    attach(viewer) {
      this.viewer = viewer;
      if (this.active) this.show(this.index); // re-render after a mode switch
    },
    get graph() { return this.viewer ? this.viewer.graph : null; },

    enter() {
      // Tolerate a click before the viewer is attached: attach() re-shows
      // the pending step as soon as the graph exists.
      this.active = true; this.index = 0;
      document.getElementById('flow-toggle').classList.add('on');
      if (this.graph) this.show(0);
    },
    exit() {
      this.active = false;
      this.clear();
      document.getElementById('flow-toggle').classList.remove('on');
      document.getElementById('flow-card').classList.remove('open');
    },
    next() { if (this.index < FLOW_STEPS.length - 1) this.show(this.index + 1); },
    prev() { if (this.index > 0) this.show(this.index - 1); },

    clear() {
      for (const h of this.highlights) h.destroy();
      this.highlights = [];
      for (const dot of this.dots) dot.remove();
      this.dots = [];
      if (this.raf) cancelAnimationFrame(this.raf);
      this.raf = null;
      document.getElementById('flow-chip').style.display = 'none';
    },

    stateFor(id) {
      const cell = this.graph.model.getCell(id);
      return cell ? this.graph.view.getState(cell) : null;
    },

    show(index) {
      if (!this.graph) return;
      this.index = index;
      const step = FLOW_STEPS[index];
      this.clear();

      const color = step.kind === 'money' ? '#b8860b' : '#2563eb';
      const cellStates = (step.cells ?? []).map((id) => this.stateFor(id)).filter(Boolean);
      const edgeStates = (step.edges ?? []).map((id) => this.stateFor(id)).filter(Boolean);

      // Highlight the boxes doing the work + the endpoints of animated edges.
      const endpointStates = edgeStates.flatMap((s) => {
        const src = s.cell.source && this.graph.view.getState(s.cell.source);
        const dst = s.cell.target && this.graph.view.getState(s.cell.target);
        return [src, dst].filter(Boolean);
      });
      for (const state of [...cellStates, ...endpointStates]) {
        const h = new mxCellHighlight(this.graph, color, 3);
        h.highlight(state);
        this.highlights.push(h);
      }
      for (const state of edgeStates) {
        const h = new mxCellHighlight(this.graph, color, 3);
        h.highlight(state);
        this.highlights.push(h);
      }
      if (!edgeStates.length) {
        for (const h of this.highlights) {
          if (h.shape?.node) h.shape.node.style.animation = 'flow-pulse 1.2s ease-in-out infinite';
        }
      }

      this.animate(edgeStates, color);
      // Center the first highlight in the scroll viewport. Its SVG node lives
      // in the rendered (CSS-scaled) space, so a boundingClientRect delta is
      // the only conversion-free way (scrollIntoView is a no-op on SVG <g>).
      // Center the step in the viewport once the highlight is painted. Read
      // the node fresh inside the timeout (the shape can be redrawn) and use
      // an instant scroll - the viewer starves smooth scrolling entirely.
      const stepAtSchedule = index;
      setTimeout(() => {
        if (!this.active || this.index !== stepAtSchedule) return;
        const node = this.highlights[0]?.shape?.node;
        if (!node) return;
        const container = document.getElementById('diagram');
        const nodeRect = node.getBoundingClientRect();
        if (!nodeRect.width && !nodeRect.height) return;
        const containerRect = container.getBoundingClientRect();
        container.scrollBy(
          nodeRect.x + nodeRect.width / 2 - (containerRect.x + containerRect.width / 2),
          nodeRect.y + nodeRect.height / 2 - (containerRect.y + containerRect.height / 2),
        );
        // Keep the card off the action: flip it left when the highlighted
        // area ends up in the right half of the viewport.
        const settled = node.getBoundingClientRect();
        document
          .getElementById('flow-card')
          .classList.toggle('left', settled.x + settled.width / 2 > window.innerWidth / 2);
        // Amount chip pinned above the active box - the "something is
        // moving here" cue even for the waterfall's internal ranks.
        if (step.amount) {
          const chip = document.getElementById('flow-chip');
          chip.textContent = step.amount;
          chip.className = step.kind === 'data' ? 'data' : '';
          chip.style.left = `${settled.x + settled.width / 2}px`;
          chip.style.top = `${settled.y}px`;
          chip.style.display = 'block';
        }
      }, 150);

      // The step card ("mini modal") - close/reopen so each step pops.
      const card = document.getElementById('flow-card');
      card.classList.remove('open');
      void card.offsetWidth; // restart the pop animation
      document.getElementById('flow-kind').textContent = step.kind.toUpperCase();
      document.getElementById('flow-kind').className = `kind ${step.kind}`;
      document.getElementById('flow-title').textContent = `${index + 1}. ${step.title}`;
      document.getElementById('flow-text').textContent = step.text;
      const pot = document.getElementById('flow-pot');
      if (step.pot) {
        pot.textContent = `In the pot: ${step.pot}`;
        pot.style.display = 'block';
      } else {
        pot.style.display = 'none';
      }
      document.getElementById('flow-count').textContent = `${index + 1} / ${FLOW_STEPS.length}`;
      document.getElementById('flow-prev').disabled = index === 0;
      document.getElementById('flow-next').textContent =
        index === FLOW_STEPS.length - 1 ? 'Done ✓' : 'Next ▶';
      card.classList.add('open');
    },

    /** Animated value dots traveling along each edge's rendered polyline. */
    animate(edgeStates, color) {
      const paths = edgeStates
        .map((state) => state.absolutePoints)
        .filter((pts) => pts && pts.length > 1)
        .map((pts) => {
          const segments = [];
          let total = 0;
          for (let i = 1; i < pts.length; i++) {
            const len = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
            segments.push({ a: pts[i - 1], b: pts[i], len });
            total += len;
          }
          return { segments, total };
        });
      if (!paths.length) return;

      const pane = this.graph.view.getOverlayPane();
      const svgNS = 'http://www.w3.org/2000/svg';
      for (const path of paths) {
        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('r', '7');
        dot.setAttribute('fill', color);
        dot.setAttribute('stroke', '#ffffff');
        dot.setAttribute('stroke-width', '2');
        pane.appendChild(dot);
        this.dots.push(dot);
        path.dot = dot;
      }
      const started = performance.now();
      const tick = (now) => {
        const t = ((now - started) / 1800) % 1; // one pass ~1.8s, looping
        for (const path of paths) {
          let distance = t * path.total;
          for (const seg of path.segments) {
            if (distance <= seg.len || seg === path.segments[path.segments.length - 1]) {
              const k = seg.len ? Math.min(1, distance / seg.len) : 0;
              path.dot.setAttribute('cx', seg.a.x + (seg.b.x - seg.a.x) * k);
              path.dot.setAttribute('cy', seg.a.y + (seg.b.y - seg.a.y) * k);
              break;
            }
            distance -= seg.len;
          }
        }
        this.raf = requestAnimationFrame(tick);
      };
      this.raf = requestAnimationFrame(tick);
    },

  };

  document.getElementById('flow-toggle').onclick = () =>
    flow.active ? flow.exit() : flow.enter();
  document.getElementById('flow-next').onclick = () =>
    flow.index === FLOW_STEPS.length - 1 ? flow.exit() : flow.next();
  document.getElementById('flow-prev').onclick = () => flow.prev();
  document.getElementById('flow-exit').onclick = () => flow.exit();
  document.addEventListener('keydown', (event) => {
    if (!flow.active) return;
    if (event.key === 'ArrowRight') flow.next();
    if (event.key === 'ArrowLeft') flow.prev();
    if (event.key === 'Escape') flow.exit();
  });

  fetch('data-spec-book.diagram.xml')
    .then((response) => response.text())
    .then((xml) => {
      schemaXml = xml;
      render();
      // The vendored viewer auto-processes .mxgraph elements when it loads,
      // but that path never hands us the viewer instance - re-render once
      // the library is up so createViewerForElement's callback can capture
      // it (the flow walkthrough needs graph states).
      const script = document.createElement('script');
      script.src = 'vendor/viewer-static.min.js';
      script.onload = () => render();
      document.body.appendChild(script);
    })
    .catch(() => {
      document.getElementById('diagram').innerHTML =
        '<p style="padding:24px">Could not load data-spec-book.diagram.xml - open this page through the spv-backend server (make dev-spv, then http://localhost:8090/).</p>';
    });
  void setMode(mode);
</script>
