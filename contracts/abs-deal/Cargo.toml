[package]
name = "abs-deal"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "26.1.0"

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
note-token = { path = "../note-token" }
paying-agent = { path = "../paying-agent" }
rate-oracle = { path = "../rate-oracle" }
serde_json = "1"
